<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年1月 | 家庭账本</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-dim: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --primary: #6366f1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
        }
        .back-link:hover { color: var(--primary); }
        h1 { font-size: 1.6em; }
        .badge {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.5em;
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-label { color: var(--text-dim); font-size: 0.9em; margin-bottom: 8px; }
        .stat-value { font-size: 2em; font-weight: 700; }
        .stat-value.income { color: var(--success); }
        .stat-value.expense { color: var(--danger); }
        .stat-value.balance { color: var(--primary); }
        
        /* Charts */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-box { height: 280px; position: relative; }
        
        /* Category List */
        .list { max-height: 350px; overflow-y: auto; }
        .list-item {
            display: flex;
            align-items: center;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
        }
        .rank {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            font-size: 0.9em;
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffb800); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; }
        .rank-other { background: rgba(255,255,255,0.1); color: var(--text-dim); }
        .item-info { flex: 1; }
        .item-merchant { font-weight: 500; margin-bottom: 2px; }
        .item-meta { font-size: 0.85em; color: var(--text-dim); }
        .item-amount { font-weight: 600; }
        .item-amount.expense { color: var(--danger); }
        
        /* All Transactions */
        .transactions { margin-top: 30px; }
        .transactions h2 { font-size: 1.2em; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .txn-item {
            display: flex;
            align-items: center;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: var(--card);
            border: 1px solid var(--border);
        }
        .txn-date { width: 45px; text-align: center; margin-right: 15px; }
        .txn-day { font-size: 1.4em; font-weight: bold; }
        .txn-month { font-size: 0.75em; color: var(--text-dim); }
        .txn-info { flex: 1; }
        .txn-merchant { font-weight: 500; }
        .txn-meta { font-size: 0.85em; color: var(--text-dim); }
        .txn-amount { font-weight: 600; font-size: 1.1em; }
        .txn-amount.expense { color: var(--danger); }
        .txn-amount.income { color: var(--success); }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 0.9em;
        }
        footer a { color: var(--primary); text-decoration: none; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> 返回首页
            </a>
            <h1>📅 2026年1月</h1>
            <span class="badge">已归档</span>
        </header>
        
        <!-- Stats -->
        <section class="stats">
            <div class="stat-card">
                <div class="stat-label">💰 总收入</div>
                <div class="stat-value income" id="income">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">💸 总支出</div>
                <div class="stat-value expense" id="expense">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📉 净流入</div>
                <div class="stat-value balance" id="balance">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📝 笔数</div>
                <div class="stat-value" id="count">0</div>
            </div>
        </section>
        
        <!-- Charts -->
        <section class="grid">
            <div class="card" style="grid-column: span 2;">
                <div class="card-title"><i class="fas fa-chart-bar"></i> 每日支出</div>
                <div class="chart-box"><canvas id="dailyChart"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-pie"></i> 分类占比</div>
                <div class="chart-box"><canvas id="categoryChart"></canvas></div>
            </div>
        </section>
        
        <!-- Category Ranking -->
        <section class="card">
            <div class="card-title"><i class="fas fa-trophy"></i> 分类排行</div>
            <div class="list" id="categoryList"></div>
        </section>
        
        <!-- All Transactions -->
        <section class="transactions">
            <h2><i class="fas fa-list"></i> 全部交易</h2>
            <div id="txnList"></div>
        </section>
        
        <footer>
            <p>📊 2026年1月 | <a href="index.html">家庭账本</a></p>
        </footer>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://nlzqtcdavheklvrlzloq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5senF0Y2Rhdmhla2x2cmx6bG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMxODgyMzcsImV4cCI6MjA2ODc2NDIzN30.aLL5OiAAxsyqH_3VvW9dC_ZwjrbXFvnZ_yNcDnZAAvQ';
        
        async function loadData() {
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/family_ledger_transactions?日期=gte.2026-01-01&日期=lte.2026-01-31&order=日期`,
                {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                }
            );
            const data = await response.json();
            updatePage(data);
        }
        
        function formatCurrency(amount) {
            return '€' + Math.abs(amount).toLocaleString('de-DE', {minimumFractionDigits: 2});
        }
        
        function updatePage(data) {
            const income = data.filter(d => d.收支 === '收入').reduce((s, d) => s + Math.abs(d.金额_eur), 0);
            const expense = data.filter(d => d.收支 === '支出').reduce((s, d) => s + d.金额_eur, 0);
            
            document.getElementById('income').textContent = formatCurrency(income);
            document.getElementById('expense').textContent = formatCurrency(expense);
            document.getElementById('balance').textContent = formatCurrency(income - expense);
            document.getElementById('count').textContent = data.length;
            
            // Daily Chart
            const daily = {};
            data.filter(d => d.收支 === '支出').forEach(d => {
                const day = d.日期.slice(5);
                daily[day] = (daily[day] || 0) + d.金额_eur;
            });
            const sortedDaily = Object.entries(daily).sort((a, b) => a[0].localeCompare(b[0]));
            
            new Chart(document.getElementById('dailyChart'), {
                type: 'bar',
                data: {
                    labels: sortedDaily.map(([d]) => d),
                    datasets: [{ data: sortedDaily.map(([,a]) => a), backgroundColor: 'rgba(239, 68, 68, 0.7)', borderRadius: 4 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', maxTicksLimit: 10 } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', callback: v => '€' + v } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
            
            // Category Chart
            const cats = {};
            data.filter(d => d.收支 === '支出').forEach(d => {
                cats[d.分类] = (cats[d.分类] || 0) + d.金额_eur;
            });
            const sortedCats = Object.entries(cats).sort((a, b) => b[1] - a[1]);
            const colors = ['#22c55e', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1', '#14b8a6'];
            
            new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: sortedCats.map(([c]) => c),
                    datasets: [{ data: sortedCats.map(([,a]) => a), backgroundColor: colors, borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#fff', padding: 8, font: { size: 10 } } } }
                }
            });
            
            // Category List
            const max = sortedCats[0]?.[1] || 1;
            document.getElementById('categoryList').innerHTML = sortedCats.map(([cat, amount], i) => {
                const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-other';
                const pct = (amount / expense * 100).toFixed(1);
                return `
                    <div class="list-item">
                        <div class="rank ${rankClass}">${i + 1}</div>
                        <div class="item-info">
                            <div class="item-merchant">${cat}</div>
                            <div class="item-meta">${pct}%</div>
                        </div>
                        <div class="item-amount expense">${formatCurrency(amount)}</div>
                    </div>
                `;
            }).join('');
            
            // Transactions List
            const sortedData = data.sort((a, b) => a.日期.localeCompare(b.日期));
            document.getElementById('txnList').innerHTML = sortedData.map(d => `
                <div class="txn-item">
                    <div class="txn-date">
                        <div class="txn-day">${d.日期.slice(8)}</div>
                        <div class="txn-month">1月</div>
                    </div>
                    <div class="txn-info">
                        <div class="txn-merchant">${d.商家}</div>
                        <div class="txn-meta">${d.分类} · ${d.支付方式}</div>
                    </div>
                    <div class="txn-amount ${d.收支 === '收入' ? 'income' : 'expense'}">
                        ${d.收支 === '收入' ? '+' : '-'}${formatCurrency(d.金额_eur)}
                    </div>
                </div>
            `).join('');
        }
        
        loadData();
    </script>
</body>
</html>
