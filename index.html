<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 家庭账本</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-dim: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --primary: #6366f1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { font-size: 1.8em; display: flex; align-items: center; gap: 12px; }
        .badge {
            background: var(--card);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.5em;
            color: var(--text-dim);
        }
        .refresh-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s;
        }
        .refresh-btn:hover { opacity: 0.9; }
        .refresh-btn i { transition: transform 0.5s; }
        .refresh-btn.loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Stats Grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        .stat-label { color: var(--text-dim); font-size: 0.9em; margin-bottom: 8px; }
        .stat-value { font-size: 2em; font-weight: 700; }
        .stat-value.income { color: var(--success); }
        .stat-value.expense { color: var(--danger); }
        .stat-value.balance { color: var(--primary); }
        
        /* Main Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-box { height: 260px; position: relative; }
        
        /* Monthly Grid */
        .months {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .month-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
        }
        .month-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .month-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .month-name { font-weight: 600; font-size: 1.1em; }
        .month-badge {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75em;
        }
        .month-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .month-stat-label { color: var(--text-dim); font-size: 0.8em; }
        .month-stat-value { font-size: 1.3em; font-weight: 600; }
        .month-stat-value.in { color: var(--success); }
        .month-stat-value.out { color: var(--danger); }
        
        /* List */
        .list { max-height: 350px; overflow-y: auto; }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
        }
        .list-item:hover { background: rgba(255,255,255,0.05); }
        .item-info { flex: 1; }
        .item-merchant { font-weight: 500; margin-bottom: 2px; }
        .item-meta { font-size: 0.85em; color: var(--text-dim); }
        .item-amount { font-weight: 600; }
        .item-amount.expense { color: var(--danger); }
        .item-amount.income { color: var(--success); }
        
        /* Category Pills */
        .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .pill {
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85em;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        .pill:hover, .pill.active { background: var(--primary); }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 0.9em;
        }
        footer a { color: var(--primary); text-decoration: none; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        
        /* Loading */
        .loading { text-align: center; padding: 40px; color: var(--text-dim); }
        .loading i { font-size: 2em; margin-bottom: 10px; animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> 家庭账本</h1>
            <button class="refresh-btn" onclick="loadData()">
                <i class="fas fa-sync-alt"></i>
                <span>刷新</span>
            </button>
        </header>
        
        <!-- Stats -->
        <section class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">💰 总收入</div>
                <div class="stat-value income" id="totalIncome">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">💸 总支出</div>
                <div class="stat-value expense" id="totalExpense">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📉 净流入</div>
                <div class="stat-value balance" id="netFlow">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📝 交易笔数</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
        </section>
        
        <!-- Charts -->
        <section class="grid">
            <div class="card" style="grid-column: span 2;">
                <div class="card-title"><i class="fas fa-chart-line"></i> 月度趋势</div>
                <div class="chart-box"><canvas id="monthlyChart"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-pie"></i> 分类占比</div>
                <div class="chart-box"><canvas id="categoryChart"></canvas></div>
            </div>
        </section>
        
        <!-- Recent & Categories -->
        <section class="grid">
            <div class="card">
                <div class="card-title"><i class="fas fa-history"></i> 最近交易</div>
                <div class="list" id="recentList"></div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-tag"></i> 分类统计</div>
                <div class="pills">
                    <span class="pill active" data-cat="全部">全部</span>
                    <span class="pill" data-cat="超市">🥬 超市</span>
                    <span class="pill" data-cat="交通-燃油">⛽ 交通-燃油</span>
                    <span class="pill" data-cat="服装">👔 服装</span>
                    <span class="pill" data-cat="餐饮">🍽️ 餐饮</span>
                    <span class="pill" data-cat="健身">🏋️ 健身</span>
                </div>
                <div class="list" id="categoryList"></div>
            </div>
        </section>
        
        <!-- Monthly Reports -->
        <h2 style="margin: 30px 0 20px; font-size: 1.2em;">
            <i class="fas fa-calendar-alt" style="color: var(--primary); margin-right: 10px;"></i>
            月度报表
        </h2>
        <section class="months" id="monthsGrid"></section>
        
        <footer>
            <p>🏠 家庭账本 | Powered by <a href="#">Supabase</a></p>
        </footer>
    </div>
    
    <script>
        // Supabase 配置 - 请替换为实际值
        const SUPABASE_URL = 'https://nlzqtcdavheklvrlzloq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5senF0Y2Rhdmhla2x2cmx6bG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMxODgyMzcsImV4cCI6MjA2ODc2NDIzN30.aLL5OiAAxsyqH_3VvW9dC_ZwjrbXFvnZ_yNcDnZAAvQ';
        
        let allData = [];
        
        async function fetchData() {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/family_ledger_transactions?order=创建时间.desc`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            return await response.json();
        }
        
        function formatCurrency(amount) {
            return '€' + Math.abs(amount).toLocaleString('de-DE', {minimumFractionDigits: 2});
        }
        
        async function loadData() {
            document.querySelector('.refresh-btn').classList.add('loading');
            try {
                allData = await fetchData();
                updateStats();
                updateRecent();
                updateCategories();
                updateMonthly();
                updateCharts();
            } catch (e) {
                console.error('Error loading data:', e);
            }
            document.querySelector('.refresh-btn').classList.remove('loading');
        }
        
        function updateStats() {
            const income = allData.filter(d => d.收支 === '收入').reduce((s, d) => s + Math.abs(d.金额_eur), 0);
            const expense = allData.filter(d => d.收支 === '支出').reduce((s, d) => s + d.金额_eur, 0);
            
            document.getElementById('totalIncome').textContent = formatCurrency(income);
            document.getElementById('totalExpense').textContent = formatCurrency(expense);
            document.getElementById('netFlow').textContent = formatCurrency(income - expense);
            document.getElementById('totalCount').textContent = allData.length;
        }
        
        function updateRecent() {
            const html = allData.slice(0, 15).map(d => `
                <div class="list-item">
                    <div class="item-info">
                        <div class="item-merchant">${d.商家}</div>
                        <div class="item-meta">${d.日期} · ${d.分类}</div>
                    </div>
                    <div class="item-amount ${d.收支 === '收入' ? 'income' : 'expense'}">
                        ${d.收支 === '收入' ? '+' : '-'}${formatCurrency(d.金额_eur)}
                    </div>
                </div>
            `).join('');
            document.getElementById('recentList').innerHTML = html;
        }
        
        function updateCategories() {
            const cats = {};
            allData.filter(d => d.收支 === '支出').forEach(d => {
                cats[d.分类] = (cats[d.分类] || 0) + d.金额_eur;
            });
            
            const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
            const max = sorted[0]?.[1] || 1;
            
            const colors = {
                '超市': '#22c55e', '交通-燃油': '#3b82f6', '服装': '#f59e0b',
                '餐饮': '#8b5cf6', '健身': '#ef4444', '娱乐': '#06b6d4',
                '医疗': '#f97316', '家电': '#84cc16', '其他': '#64748b',
                '孩子-服装': '#ec4899', '交通-公交': '#14b8a6'
            };
            
            const html = sorted.slice(0, 10).map(([cat, amount], i) => `
                <div class="list-item">
                    <div style="width:30px;font-weight:bold;color:${i<3?'#ffd700':var('--text-dim')}">${i+1}</div>
                    <div class="item-info">
                        <div class="item-merchant">${cat}</div>
                        <div class="item-meta">${((amount/max)*100).toFixed(0)}%</div>
                    </div>
                    <div class="item-amount expense">${formatCurrency(amount)}</div>
                </div>
            `).join('');
            document.getElementById('categoryList').innerHTML = html;
        }
        
        function updateMonthly() {
            const months = {};
            allData.forEach(d => {
                const m = d.日期.substring(0, 7);
                if (!months[m]) months[m] = { income: 0, expense: 0 };
                if (d.收支 === '收入') months[m].income += Math.abs(d.金额_eur);
                else months[m].expense += d.金额_eur;
            });
            
            const sorted = Object.entries(months).sort().reverse();
            const html = sorted.map(([month, data]) => `
                <a href="#" class="month-card">
                    <div class="month-header">
                        <span class="month-name">${month.replace('-', '年')}月</span>
                        <span class="month-badge">${data.income > 0 ? '已归档' : '进行中'}</span>
                    </div>
                    <div class="month-stats">
                        <div>
                            <div class="month-stat-label">收入</div>
                            <div class="month-stat-value in">${formatCurrency(data.income)}</div>
                        </div>
                        <div>
                            <div class="month-stat-label">支出</div>
                            <div class="month-stat-value out">${formatCurrency(data.expense)}</div>
                        </div>
                    </div>
                </a>
            `).join('');
            document.getElementById('monthsGrid').innerHTML = html;
        }
        
        function updateCharts() {
            // Monthly Chart
            const months = {};
            allData.forEach(d => {
                const m = d.日期.substring(0, 7);
                if (!months[m]) months[m] = { income: 0, expense: 0 };
                if (d.收支 === '收入') months[m].income += Math.abs(d.金额_eur);
                else months[m].expense += d.金额_eur;
            });
            
            const sorted = Object.entries(months).sort();
            new Chart(document.getElementById('monthlyChart'), {
                type: 'bar',
                data: {
                    labels: sorted.map(([m]) => m.replace('-', '/')),
                    datasets: [
                        { label: '收入', data: sorted.map(([,d]) => d.income), backgroundColor: 'rgba(34, 197, 94, 0.7)', borderRadius: 6 },
                        { label: '支出', data: sorted.map(([,d]) => d.expense), backgroundColor: 'rgba(239, 68, 68, 0.7)', borderRadius: 6 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', callback: v => '€' + v } }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
            
            // Category Chart
            const cats = {};
            allData.filter(d => d.收支 === '支出').forEach(d => {
                cats[d.分类] = (cats[d.分类] || 0) + d.金额_eur;
            });
            
            const sortedCats = Object.entries(cats).sort((a, b) => b[1] - a[1]);
            const catColors = ['#22c55e', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1'];
            
            new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: sortedCats.map(([c]) => c),
                    datasets: [{ data: sortedCats.map(([,a]) => a), backgroundColor: catColors, borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#fff', padding: 8, font: { size: 10 } } } }
                }
            });
        }
        
        // Initial load
        loadData();
    </script>
</body>
</html>
